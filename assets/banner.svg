<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Filters for Glow and Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #38bdf8;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
      }
      .flow-pulse {
        animation: pulseLine 3s linear infinite;
      }
      .node-float {
        animation: floatNode 4s ease-in-out infinite alternate;
      }
      .node-float-rev {
        animation: floatNodeRev 4s ease-in-out infinite alternate;
      }
      @keyframes floatNode {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatNodeRev {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="360" fill="url(#grid)" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="280" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow)" />

  <!-- DYNAMIC / ANIMATED WORKFLOW PIPELINE IN BACKGROUND -->
  <g opacity="0.6">
    <!-- Connecting Circuit / Workflow Lines -->
    <path d="M 120 290 Q 280 290 380 230 T 640 230 T 900 130 T 1100 130" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="6 6" />
    
    <!-- Animated Light Pulse along the pipeline -->
    <path d="M 120 290 Q 280 290 380 230 T 640 230 T 900 130 T 1100 130" fill="none" stroke="url(#primaryAccent)" stroke-width="4" stroke-dasharray="18 120">
      <animate attributeName="stroke-dashoffset" from="500" to="0" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Floating Interactive Workflow Step Pills / Cards -->
    <!-- Trigger Pill -->
    <g class="node-float" transform="translate(140, 260)">
      <rect width="140" height="46" rx="23" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
      <circle cx="25" cy="23" r="8" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="44" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Webhook Trigger</text>
    </g>

    <!-- Transform Node -->
    <g class="node-float-rev" transform="translate(560, 205)">
      <rect width="130" height="46" rx="23" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)" />
      <polygon points="20,16 28,23 20,30" fill="#818cf8" />
      <text x="36" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Transform</text>
    </g>

    <!-- Action Pill -->
    <g class="node-float" transform="translate(930, 105)">
      <rect width="140" height="46" rx="23" fill="#1e293b" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)" />
      <path d="M 20 23 L 26 29 L 34 17" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
      <text x="44" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Deploy Action</text>
    </g>
  </g>

  <!-- FOREGROUND BRANDING CONTENT (Centered, Unobstructed & Crisp) -->
  <!-- Top Category Chip -->
  <g transform="translate(600, 70)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#0f172a" stroke="url(#primaryAccent)" stroke-width="1.5" opacity="0.95" />
    <text class="badge-text" text-anchor="middle" y="5">⚡ CURATED WORKFLOW ECOSYSTEM</text>
  </g>

  <!-- Main Repository Title -->
  <text class="title-text" x="600" y="142" text-anchor="middle">
    Awesome No-Code Workflow Automation
  </text>

  <!-- Title Underline Glow Bar -->
  <rect x="360" y="162" width="480" height="3" rx="1.5" fill="url(#primaryAccent)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Descriptive Subtitle -->
  <text class="subtitle-text" x="600" y="198" text-anchor="middle">
    A premier collection of enterprise SaaS platforms, visual integration builders &amp; self-hosted open-source engines
  </text>

  <!-- Core Metric / Feature Highlights -->
  <g transform="translate(600, 240)">
    <!-- SaaS Pill -->
    <g transform="translate(-250, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <text font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle" y="4">☁️ Enterprise SaaS</text>
    </g>
    <!-- Open Source Pill -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1" opacity="0.9" />
      <text font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle" y="4">💻 Self-Hosted Open-Source</text>
    </g>
    <!-- Visual iPaaS Pill -->
    <g transform="translate(240, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1" opacity="0.9" />
      <text font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle" y="4">🔄 Visual iPaaS</text>
    </g>
  </g>
</svg>
